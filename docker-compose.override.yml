# docker-compose.override.yml
# Adds backend and frontend services with Anti-Spoofing, Multi-Face detection, and CORS-free reverse proxy support.
# Run with: docker compose -f docker-compose.override.yml up -d

services:

  # ─── DATABASE (PostgreSQL 16) ────────────────────────────────────────────────
  postgres_absensi:
    image: postgres:16-alpine
    container_name: postgres_absensi
    restart: unless-stopped
    environment:
      POSTGRES_DB: absensi_db
      POSTGRES_USER: absensi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-absensi_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Jakarta
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - absensi_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U absensi -d absensi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── BACKEND (Node.js Express + PostgreSQL + Anti-Spoofing) ──────────────────
  backend_absensi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_absensi
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Database connection
      DATABASE_URL: postgres://absensi:${POSTGRES_PASSWORD:-absensi_pass_2026}@postgres_absensi:5432/absensi_db
      DB_PATH: /data/attendance.db
      # MQTT disabled by default (direct web kiosk mode)
      MQTT_ENABLED: "false"
      MQTT_BROKER: mqtt://192.168.100.52:1883
      MQTT_TOPIC: "double-take/matches/#"
      # CompreFace connection (GPU-accelerated instance on server)
      COMPREFACE_URL: http://192.168.100.52:8000
      COMPREFACE_API_KEY: ${COMPREFACE_API_KEY:-b410e83f-4343-4079-a98f-d43e13610846}
      # Anti-Spoofing (Passive Liveness Detection via MiniFASNet)
      ENABLE_ANTISPOOF: "true"
      ANTISPOOF_THRESHOLD: "0.50"
      ANTISPOOF_MODEL_PATH: /app/models/minifasnet_v2.onnx
      # Google OAuth & Admin
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-961412708536-r7d1390rqd66hrnkgq9dctb58ur5rnh0.apps.googleusercontent.com}
      INITIAL_SUPER_ADMIN_EMAIL: ${INITIAL_SUPER_ADMIN_EMAIL:-}
      # JWT Auth
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 12h
      # Admin credentials (fallback)
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Recognition Settings
      CONFIDENCE_THRESHOLD: 80
      DEBOUNCE_MINUTES: 3
      # Timezone WIB
      TZ: Asia/Jakarta
    volumes:
      - ./data:/data
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    networks:
      - absensi_net
    depends_on:
      postgres_absensi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── FRONTEND (Next.js Kiosk) ────────────────────────────────────────────────
  frontend_absensi:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ""
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-961412708536-r7d1390rqd66hrnkgq9dctb58ur5rnh0.apps.googleusercontent.com}
    container_name: frontend_absensi
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ""
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-961412708536-r7d1390rqd66hrnkgq9dctb58ur5rnh0.apps.googleusercontent.com}
      INTERNAL_BACKEND_URL: "http://backend_absensi:3001"
      HOSTNAME: "0.0.0.0"
      PORT: 8080
    networks:
      - absensi_net
    depends_on:
      - backend_absensi

networks:
  absensi_net:
    external: true
